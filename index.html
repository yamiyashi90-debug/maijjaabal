<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEGAANIME - Watch Free</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#fff;font-family:Arial}
nav{display:flex;justify-content:space-between;padding:12px 20px;background:#111;align-items:center}
.logo{font-size:28px;font-weight:900;color:#ff0000;letter-spacing:1px}
.logo b{color:#fff}
.hero{height:65vh;background:linear-gradient(0deg,#080808 0%,transparent 60%),url('https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=800');background-size:cover;display:flex;flex-direction:column;justify-content:flex-end;padding:25px}
.hero h1{font-size:32px} .hero p{opacity:.7;margin:8px 0} .btn{background:#ff0000;border:none;color:#fff;padding:10px 20px;border-radius:5px;font-weight:bold;margin-top:10px;width:120px}
h2{padding:20px 20px 5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;padding:15px}
.card{background:#1a1a1a;border-radius:8px;overflow:hidden}
.card img{width:100%;height:180px;object-fit:cover} .card .info{padding:8px;font-size:12px}
input{padding:8px 15px;border-radius:20px;border:none;background:#222;color:#fff;width:45%}
</style>
</head>
<body>
<nav>
<div class="logo">NEGA<b>ANIME</b></div>
<input id="s" placeholder="Search Naruto, One Piece...">
</nav>

<div class="hero">
<h1>NEGAANIME Originals</h1>
<p>Ad-free. Fast. Made by You.</p>
<button class="btn">▶ WATCH</button>
</div>

<h2>🔥 Trending This Week</h2>
<div class="grid" id="grid"></div>

<script>
const grid=document.getElementById('grid');
const s=document.getElementById('s');
async function getAnime(q){
grid.innerHTML='Loading...';
let url=q?`https://api.jikan.moe/v4/anime?q=${q}&limit=18&sfw=true`:`https://api.jikan.moe/v4/top/anime?limit=18&sfw=true`;
let r=await fetch(url); let j=await r.json();
grid.innerHTML='';
j.data.forEach(a=>{
grid.innerHTML+=`<div class="card"><img src="${a.images.jpg.large_image_url}"><div class="info">${a.title_english||a.title.substring(0,25)}</div></div>`
})
}
getAnime();
let t; s.addEventListener('input',e=>{clearTimeout(t); t=setTimeout(()=>getAnime(e.target.value),600)})
</script>
</body>
</html>
